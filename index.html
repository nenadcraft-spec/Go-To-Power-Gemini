<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Šta je novo - Updates</title>
  <style>
    /* Tamna zamagljena pozadina (Modal Overlay) */
    .news-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Kontejner taba */
    .news-tab-container {
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      padding: 24px;
      position: relative;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Zaglavlje */
    .tab-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 14px;
      margin-bottom: 24px;
      padding-right: 40px; /* Prostor za X dugme */
    }

    .tab-header h2 {
      margin: 0;
      font-size: 1.5rem;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-badge {
      background: #dcfce7;
      color: #15803d;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* DUGME ZA ZATVARANJE (X) */
    .close-modal-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #f3f4f6;
      border: none;
      font-size: 1.2rem;
      font-weight: bold;
      color: #4b5563;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .close-modal-btn:hover {
      background: #e5e7eb;
      color: #111827;
      transform: scale(1.05);
    }

    /* Kartica ažuriranja */
    .update-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 16px;
      background: #ffffff;
      position: relative;
      transition: all 0.2s ease-in-out;
    }

    /* Specijalni stil za NAJNOVIJE ažuriranje na vrhu */
    .update-card.latest {
      border: 2px solid #2563eb;
      background: #f8fafc;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
    }

    .latest-tag {
      display: inline-block;
      background: #2563eb;
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .update-meta {
      display: flex;
      justify-content: space-between;
      color: #6b7280;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .update-title {
      margin: 0 0 10px 0;
      font-size: 1.2rem;
      color: #1f2937;
    }

    /* Značke (Tagovi) */
    .update-tags {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .tag {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .tag.igra { background: #dbeafe; color: #1e40af; }
    .tag.novo { background: #fef3c7; color: #92400e; }
    .tag.fix { background: #fee2e2; color: #991b1b; }

    /* Lista promena */
    .update-details {
      margin: 0;
      padding-left: 20px;
      color: #4b5563;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .update-details li {
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <!-- Modal Kontejner sa pozadinom -->
  <div id="newsModal" class="news-modal-overlay">
    <div class="news-tab-container">
      
      <!-- DUGME ZA ZATVARANJE -->
      <button class="close-modal-btn" onclick="closeNewsModal()" aria-label="Zatvori">✕</button>

      <div class="tab-header">
        <h2>Šta je novo 🚀</h2>
        <span class="live-badge">Live Updates</span>
      </div>
      
      <!-- JS ovde automatski ubacuje objave -->
      <div id="updates-feed"></div>
    </div>
  </div>

  <script>
    // Baza ažuriranja (Nova igra je na samom vrhu)
    const updatesData = [
      {
        id: 3,
        title: "Nova Igra: Svemirski Osvajači! 🛸",
        date: "31. jul 2026.",
        version: "v2.4.0",
        tags: ["igra", "novo"],
        changes: [
          "Dodata potpuno nova igra sa globalnom rang-listom.",
          "Optimizovano učitavanje i mobilne kontrole.",
          "Ispravljen problem sa čuvanjem poena."
        ]
      },
      {
        id: 2,
        title: "Poboljšan korisnički profil",
        date: "15. jul 2026.",
        version: "v2.3.1",
        tags: ["novo"],
        changes: [
          "Dodate nove opcije za prilagođavanje avatara.",
          "Učitivanje profilne stranice je sada 30% brže."
        ]
      },
      {
        id: 1,
        title: "Ispravke stabilnosti sajta",
        date: "01. jul 2026.",
        version: "v2.3.0",
        tags: ["fix"],
        changes: [
          "Rešen problem sa prijavljivanjem preko Fejsbuka."
        ]
      }
    ];

    function renderUpdates() {
      const feedContainer = document.getElementById("updates-feed");
      feedContainer.innerHTML = "";

      // Sortiramo po ID-ju tako da je NAJNOVIJI update uvek prvi!
      const sortedUpdates = updatesData.sort((a, b) => b.id - a.id);

      sortedUpdates.forEach((item, index) => {
        const isLatest = index === 0;

        const card = document.createElement("div");
        card.className = `update-card ${isLatest ? 'latest' : ''}`;

        const tagsHTML = item.tags
          .map(tag => `<span class="tag ${tag}">${tag}</span>`)
          .join("");

        const changesHTML = item.changes
          .map(change => `<li>${change}</li>`)
          .join("");

        card.innerHTML = `
          ${isLatest ? '<span class="latest-tag">Najnoviji Update ★</span>' : ''}
          <div class="update-meta">
            <span>Verzija ${item.version}</span>
            <span>${item.date}</span>
          </div>
          <h3 class="update-title">${item.title}</h3>
          <div class="update-tags">${tagsHTML}</div>
          <ul class="update-details">
            ${changesHTML}
          </ul>
        `;

        feedContainer.appendChild(card);
      });
    }

    // Funkcija za zatvaranje modala
    function closeNewsModal() {
      const modal = document.getElementById("newsModal");
      if (modal) {
        modal.style.display = "none";
      }
    }

    // Zatvaranje klikom van modala (na zamagljenu pozadinu)
    window.addEventListener("click", function(event) {
      const modal = document.getElementById("newsModal");
      if (event.target === modal) {
        closeNewsModal();
      }
    });

    // Zatvaranje pritiskom na ESC taster
    window.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closeNewsModal();
      }
    });

    // Pokreni prikazivanje
    document.addEventListener("DOMContentLoaded", renderUpdates);
  </script>

</body>
</html>
