<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WHR: POWER WTF UP v4.2.1</title>
    <link rel="stylesheet" href="style.css?v=4.2.1">
</head>
<body>
    <div id="gameApp">
        <!-- START SCREEN -->
        <div id="startScreen" class="screen screen--active">
            <h1 class="title">WHR: POWER WTF UP</h1>
            <p class="subtitle">CYBER RABBIT ARENA</p>
            <button id="startButton" class="btn btn--primary">POKRENI IGRU</button>
        </div>

        <!-- GAME SCREEN -->
        <div id="gameScreen" class="screen">
            <div id="hud">
                <div class="hud-item">
                    <span class="hud-label">SCORE</span>
                    <span id="scoreValue" class="hud-value">000000</span>
                </div>
                <div class="hud-item hud-version">
                    <span>ALFA v4.2.1</span>
                </div>
            </div>

            <div id="gameStage">
                <canvas id="gameCanvas"></canvas>
            </div>

            <!-- CONTROLS ZONE -->
            <div id="controls">
                <div id="joystickZone">
                    <div id="joystickBase">
                        <div id="joystickStick"></div>
                    </div>
                </div>
                <button id="shootButton" class="btn btn--fire">FIRE</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=4.2.1"></script>
</body>
</html>
