<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WHR: ARENA SURVIVAL v5.2.1</title>
    <link rel="stylesheet" href="style.css?v=5.2.1">
</head>
<body>
    <div id="gameApp">
        <!-- START SCREEN -->
        <div id="startScreen" class="screen screen--active">
            <h1 class="title">WHR: ARENA SURVIVAL</h1>
            <p class="subtitle">CYBER RABBIT REFLEX</p>
            <button id="startButton" class="btn btn--primary">START ARENA</button>
        </div>

        <!-- GAME SCREEN -->
        <div id="gameScreen" class="screen">
            <div id="arenaFrame">
                <div id="hud">
                    <div class="hud-item">
                        <span class="hud-label">LIVES</span>
                        <span id="livesValue" class="hud-value">❤️❤️❤️</span>
                    </div>
                    <div class="hud-item">
                        <span class="hud-label">TIMER</span>
                        <span id="timerValue" class="hud-value">45.0s</span>
                    </div>
                    <div class="hud-item">
                        <span class="hud-label">SCORE</span>
                        <span id="scoreValue" class="hud-value">000000</span>
                    </div>
                    <div class="hud-item">
                        <span id="levelValue" class="hud-version">LVL 1</span>
                    </div>
                </div>

                <div id="gameStage">
                    <canvas id="gameCanvas"></canvas>
                </div>
            </div>
        </div>

        <!-- GAME OVER SCREEN -->
        <div id="gameOverScreen" class="screen">
            <h1 class="title" style="color: #ff315d;">GAME OVER</h1>
            <p class="subtitle">FINAL SCORE: <span id="finalScoreValue" style="color: #32ff9b;">0</span></p>
            <button id="restartButton" class="btn btn--primary">PLAY AGAIN</button>
        </div>
    </div>

    <script src="script.js?v=5.4.0"></script>
</body>
</html>
