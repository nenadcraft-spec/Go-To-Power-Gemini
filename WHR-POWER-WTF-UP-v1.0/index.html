<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulacija Ekosistema: Zečevi i Predatori</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Simulacija Ekosistema</h1>
        
        <div class="controls">
            <button id="btnSpawnRabbit">Dodaj Zeca 🐇</button>
            <button id="btnSpawnPredator">Dodaj Predatora 🦊</button>
            <button id="btnTogglePause">Pauza / Pokreni ⏯️</button>
        </div>

        <div class="stats">
            <span>Broj zečeva: <strong id="statRabbits">0</strong></span> | 
            <span>Broj predatora: <strong id="statPredators">0</strong></span> | 
            <span>Generacija: <strong id="statGenerations">1</strong></span>
        </div>

        <canvas id="simCanvas" width="800" height="500"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
