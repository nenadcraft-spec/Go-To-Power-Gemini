<!-- GAME SCREEN -->
<section id="gameScreen" class="screen game-screen" aria-label="WHR Game">
    
    <!-- TOP HUD -->
    <header class="hud">
        <div class="hud__row">
            <div class="hud-stat">
                <span class="hud-stat__label">SCORE</span>
                <strong id="scoreValue" class="hud-stat__value">000000</strong>
            </div>

            <div class="level-display">
                <span class="level-display__label">LVL</span>
                <strong id="levelValue" class="level-display__value">01</strong>
            </div>

            <div class="hud-stat">
                <span class="hud-stat__label">BEST</span>
                <strong id="bestScoreValue" class="hud-stat__value">000000</strong>
            </div>

            <div class="hud-stat hud-stat--combo">
                <span class="hud-stat__label">COMBO</span>
                <strong id="comboValue" class="hud-stat__value">x1</strong>
            </div>

            <div class="lives-display">
                <span class="lives-display__label">LIVES</span>
                <div id="livesContainer" class="lives-display__icons">
                    <span class="life-icon">♥</span>
                    <span class="life-icon">♥</span>
                    <span class="life-icon">♥</span>
                </div>
            </div>

            <button id="pauseButton" class="pause-button" type="button" aria-label="Pause">
                <span></span><span></span>
            </button>
        </div>
    </header>

    <!-- MAIN PLAY ARENA -->
    <div id="gameStage" class="game-stage">
        <canvas id="gameCanvas" tabindex="0"></canvas>
        
        <div id="screenFlash" class="screen-flash" aria-hidden="true"></div>
        <div id="earthquakeOverlay" class="earthquake-overlay" aria-hidden="true">
            <span>SEISMIC ANOMALY</span>
        </div>

        <div id="levelAnnouncement" class="level-announcement" aria-live="assertive">
            <span class="level-announcement__small">ENTERING</span>
            <strong id="levelAnnouncementValue" class="level-announcement__main">LEVEL 01</strong>
            <span id="levelAnnouncementMessage" class="level-announcement__message">CONTROL THE CHAOS</span>
        </div>

        <div id="wtfAnnouncement" class="wtf-announcement" aria-live="assertive">
            <span class="wtf-announcement__power">POWER</span>
            <strong class="wtf-announcement__wtf">WTF</strong>
            <span class="wtf-announcement__up">UP</span>
            <small id="wtfEffectMessage" class="wtf-announcement__effect"></small>
        </div>

        <div id="comboAnnouncement" class="combo-announcement" aria-live="polite">COMBO x2</div>
        <div id="statusMessage" class="status-message" aria-live="polite"></div>

        <!-- PAUSE OVERLAY -->
        <div id="pauseOverlay" class="game-overlay pause-overlay" hidden>
            <div class="game-overlay__content">
                <p class="game-overlay__eyebrow">SYSTEM PAUSED</p>
                <h2 class="game-overlay__title">PAUSE</h2>
                <button id="resumeButton" class="button button--primary" type="button">RESUME</button>
                <button id="restartFromPauseButton" class="button button--secondary" type="button">RESTART</button>
                <button id="quitFromPauseButton" class="button button--ghost" type="button">MAIN MENU</button>
            </div>
        </div>
    </div>

    <!-- BOTTOM COMPACT CONTROLS -->
    <div id="mobileControls" class="mobile-controls">
        <div id="joystickZone" class="joystick-zone">
            <div id="joystickBase" class="joystick-base">
                <div id="joystickStick" class="joystick-stick"></div>
            </div>
        </div>

        <button id="shootButton" class="control-button control-button--shoot" type="button">
            <span class="control-button__text">FIRE</span>
        </button>
    </div>

</section>
